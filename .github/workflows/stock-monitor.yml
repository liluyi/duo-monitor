name: iPhone Duo Stock Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore stock state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run monitor
        env:
          NOTIFY_BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python3 iphone_duo_monitor.py --once --ci --parts MK2Q4CH/A,MK2P4CH/A,MK2T4CH/A,MK2U4CH/A
